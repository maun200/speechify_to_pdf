name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Syntax check
        run: python3 -m py_compile speechify_to_pdf.py
      - name: Install dependencies
        run: pip install pymupdf pytest
      - name: Run tests
        run: python3 -m pytest tests/ -v
