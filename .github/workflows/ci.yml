name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        run: python3 -m py_compile speechify_to_pdf.py
      - name: Install dependencies
        run: pip install pymupdf pytest build ruff
      - name: Lint (ruff)
        run: ruff check speechify_to_pdf.py
      - name: Run tests
        run: python3 -m pytest tests/ -v
      - name: Build package
        run: python3 -m build
      - name: Install built wheel and verify entry point
        run: |
          pip install dist/*.whl
          speechify-to-pdf --version
