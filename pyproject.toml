[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "speechify-to-pdf"
version = "1.2.2"
description = "Transfer Speechify highlights as annotations into a local PDF file"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["pymupdf>=1.27.2.3"]
authors = [
    {name = "maun200", email = "maun200@users.noreply.github.com"},
]
keywords = ["speechify", "pdf", "annotations", "highlights", "productivity", "pymupdf"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/maun200/speechify_to_pdf"
Repository = "https://github.com/maun200/speechify_to_pdf"
"Bug Tracker" = "https://github.com/maun200/speechify_to_pdf/issues"
Funding = "https://www.paypal.com/donate/?business=m.gruda%40web.de&currency_code=EUR"

[project.scripts]
speechify-to-pdf = "speechify_to_pdf:main"

[tool.setuptools]
py-modules = ["speechify_to_pdf"]
